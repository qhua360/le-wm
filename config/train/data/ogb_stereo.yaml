dataset:
  name: ogbench/cube_single_expert_stereo_b06.h5  # written by render_stereo.py
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 5
  keys_to_load:
    - pixels.left
    - pixels.right
    - action
    - observation
  keys_to_cache:
    - action
    - observation
  keys_to_merge:
    proprio: proprio